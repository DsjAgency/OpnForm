map $request_uri $api_uri {
    ~^/api(/.*$) $1;
    default $request_uri;
}

server {
    listen 80;
    server_name opnform;
    root /usr/share/nginx/html/public;
    client_max_body_size ${NGINX_MAX_BODY_SIZE};

    access_log /dev/stdout;
    error_log /dev/stderr error;

    index index.html index.htm index.php;

    # DNS interno do Docker: reconsulta os containers a cada 10s, para que
    # recriar a API ou o client (novo IP) não deixe o nginx no IP antigo (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $client_upstream http://opnform-client:3000;
    set $api_upstream opnform-api:9000;

    location / {
        proxy_http_version 1.1;
        proxy_pass $client_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Ícones do @nuxt/icon são servidos pelo Nuxt, não pelo Laravel.
    # ^~ impede que a regra de /api/ abaixo capture essa rota.
    location ^~ /api/_nuxt_icon/ {
        proxy_http_version 1.1;
        proxy_pass $client_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ~/(api|open|local\/temp|forms\/assets)/ {
        set $original_uri $uri;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $api_uri;
        # Laravel accepts these headers only from IPs listed in TRUSTED_PROXIES.
        # This preserves the client IP behind an explicitly trusted reverse proxy.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Deny access to . files
    location ~ /\. {
        deny all;
    }
}
